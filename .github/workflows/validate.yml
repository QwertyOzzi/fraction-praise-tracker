name: Validate static site
on:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax in index.html
        run: |
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x => x[1]).filter(x => x.trim());
          if (!scripts.length) throw new Error('No inline JavaScript detected');
          scripts.forEach((script, i) => new vm.Script(script, {filename: 'inline-'+i+'.js'}));
          console.log('JavaScript syntax passed: ' + scripts.length + ' scripts');
          JS
      - name: Check secure link handling and sheet metadata
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const required of ['safeProofUrl(', 'noopener noreferrer', '{ merge: true }']) {
            if (!html.includes(required)) throw Error('Missing guard: '+required);
          }
          console.log('Static site guards passed');
          JS
